<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1000">
  <!-- Giro 2D (de frente), redesenhado em vetor a partir de ref/folha.png. Grupos com id para animar. -->
  <defs>
    <style>
      .o { stroke: #16224a; stroke-width: 8; stroke-linejoin: round; stroke-linecap: round; }
      .azul { fill: #2160e6; } .azulc { fill: #3d7cf2; } .branco { fill: #eef2f7; } .sombra { fill: #d5dbe7; }
      .membro { fill: #3b4560; } .luva { fill: #2b3550; } .tela { fill: #1e2944; } .ciano { fill: #7fe0ea; }
    </style>
    <!-- uma perna; a outra e o espelho -->
    <g id="perna">
      <rect class="membro o" x="288" y="718" width="36" height="90" rx="12"/>
      <ellipse class="branco o" cx="306" cy="812" rx="34" ry="32"/>
      <path class="azul o" d="M262 840 Q262 828 276 828 L336 828 Q350 828 350 840 L354 914 Q386 920 388 950 Q390 980 358 980 L248 980 Q220 980 222 952 Q224 924 258 914 Z"/>
      <path class="azulc" d="M274 846 L290 846 L288 902 L272 902 Z"/>
      <path class="o" fill="none" d="M232 962 L380 962"/>
    </g>
    <!-- um braco; o outro e o espelho -->
    <g id="braco">
      <line x1="170" y1="474" x2="120" y2="590" stroke="#16224a" stroke-width="44" stroke-linecap="round"/>
      <line x1="170" y1="474" x2="120" y2="590" stroke="#3b4560" stroke-width="30" stroke-linecap="round"/>
      <g transform="rotate(4 110 672)">
        <rect class="branco o" x="68" y="590" width="84" height="164" rx="42"/>
        <path class="azul" d="M68 632 A42 42 0 0 1 110 590 L110 754 A42 42 0 0 1 68 712 Z"/>
        <rect x="68" y="590" width="84" height="164" rx="42" fill="none" class="o"/>
      </g>
      <g class="luva o">
        <rect x="84" y="788" width="16" height="44" rx="8"/><rect x="102" y="792" width="16" height="46" rx="8"/><rect x="120" y="788" width="16" height="42" rx="8"/>
        <ellipse cx="112" cy="776" rx="36" ry="30"/>
        <ellipse cx="148" cy="772" rx="12" ry="19" transform="rotate(-30 148 772)"/>
      </g>
      <circle class="azul o" cx="176" cy="462" r="34"/>
    </g>
  </defs>

  <ellipse cx="365" cy="980" rx="205" ry="18" fill="#e4e9f1"/>

  <!-- anel: parte de tras (passa atras da cabeca) -->
  <g id="anel-tras" transform="rotate(-16 360 402)" fill="none" stroke-linecap="round">
    <path d="M628.5 323.6 A315 150 0 0 0 45 402" stroke="#16224a" stroke-width="38"/>
    <path d="M628.5 323.6 A315 150 0 0 0 45 402" stroke="#2160e6" stroke-width="26"/>
  </g>

  <use id="perna-esq" href="#perna"/>
  <use id="perna-dir" href="#perna" transform="matrix(-1 0 0 1 730 0)"/>

  <!-- quadril (saia azul) -->
  <path id="quadril" class="azul o" d="M262 672 Q262 740 365 740 Q468 740 468 672 Z"/>

  <use id="braco-esq" href="#braco"/>
  <use id="braco-dir" href="#braco" transform="matrix(-1 0 0 1 730 0)"/>

  <!-- corpo: cabeca e tronco num bloco so; mais fino embaixo, mais largo em cima; crista arredondada -->
  <g id="corpo">
    <path class="azul o" d="M170 164 Q170 118 214 118 L288 118 L300 90 L404 40 Q426 30 428 52 L432 106 L516 110 Q560 112 560 156 L518 646 Q515 684 480 684 L250 684 Q215 684 212 646 Z"/>
    <path class="azulc" d="M186 166 L196 360 L210 360 L201 166 Z"/>
    <circle class="azul o" cx="178" cy="238" r="20"/><circle class="azul o" cx="553" cy="238" r="20"/>
    <!-- frente branca com sombra embaixo a esquerda -->
    <path class="branco o" d="M190 380 Q365 352 546 366 L516 646 Q514 668 490 668 L240 668 Q218 668 216 646 Z"/>
    <path class="sombra" d="M206 562 Q300 612 410 664 L240 664 Q222 664 220 646 Z"/>
    <!-- simbolo do Comercial 360: as 3 torres, mais embaixo no painel -->
    <g id="simbolo" class="azul" transform="translate(17 34)">
      <path d="M286 592 V470 L322 452 V592 Z"/>
      <path d="M330 592 V446 L310 458 V436 L368 398 V592 Z"/>
      <path d="M376 592 V424 L410 444 V592 Z"/>
    </g>
  </g>

  <!-- rosto: tela escura, olhos em arco e boca aberta -->
  <g id="rosto">
    <rect class="tela o" x="206" y="142" width="320" height="190" rx="28"/>
    <g id="olhos" fill="none" stroke="#7fe0ea" stroke-width="16" stroke-linecap="round">
      <path d="M270 240 Q300 204 330 240"/><path d="M402 240 Q432 204 462 240"/>
    </g>
    <path id="boca" class="ciano" d="M330 264 L400 264 Q398 302 365 304 Q332 302 330 264 Z"/>
  </g>

  <!-- anel: parte da frente (cruza a barriga) e a bolinha -->
  <g id="anel-frente" transform="rotate(-16 360 402)" fill="none" stroke-linecap="round">
    <path d="M45 402 A315 150 0 0 0 675 402" stroke="#ffffff" stroke-width="52"/>
    <path d="M45 402 A315 150 0 0 0 675 402" stroke="#16224a" stroke-width="38"/>
    <path d="M45 402 A315 150 0 0 0 675 402" stroke="#2160e6" stroke-width="26"/>
    <circle id="bolinha" cx="661" cy="357.7" r="15" fill="#2160e6" stroke="#16224a" stroke-width="7"/>
  </g>
</svg>
